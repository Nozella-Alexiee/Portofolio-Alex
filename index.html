<!doctype html>
<html lang="id" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo-smksig.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Alex — Web Developer & Finance Enthusiast</title>
    <meta name="description" content="Portofolio Ahmad Zulfikri Alexander Disyin (Alex), siswa XII RPL SMK SIG. Fokus pada Web Development, Sistem Terdistribusi, dan Analisis Keuangan." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      window.addEventListener('error', function(e) {
        var d = document.createElement('div');
        d.id = 'debug-error-box';
        d.style = "position:fixed;top:0;left:0;right:0;background:#dc2626;color:white;padding:24px;z-index:999999;font-family:monospace;white-space:pre-wrap;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,0.5);";
        d.textContent = 'JAVASCRIPT RUNTIME ERROR:\n' + e.message + '\nat ' + e.filename + ':' + e.lineno + ':' + e.colno + '\n' + (e.error ? e.error.stack : '');
        document.body.appendChild(d);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var d = document.createElement('div');
        d.id = 'debug-error-box';
        d.style = "position:fixed;top:0;left:0;right:0;background:#dc2626;color:white;padding:24px;z-index:999999;font-family:monospace;white-space:pre-wrap;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,0.5);";
        d.textContent = 'PROMISE REJECTION:\n' + (e.reason && e.reason.stack ? e.reason.stack : e.reason);
        document.body.appendChild(d);
      });
    </script>
  </head>
  <body class="bg-[#070b14] text-slate-100 font-['Plus_Jakarta_Sans',sans-serif] selection:bg-blue-500 selection:text-white antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
